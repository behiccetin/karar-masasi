e report", "reportNotReady": "The decision matrix and the weights must be complete for a report.", "reportTitle": "Multi-criteria decision report", "reportDate": "Report date: {0}", "secProblem": "Decision problem", "secWeights": "Criterion weights", "secRanking": "Ranking of alternatives", "weightMethodLine": "Weighting method: {0}.", "dirLegend": "(+) benefit criterion: higher is preferred. (−) cost criterion: lower is preferred.", "tableN": "Table {0}. {1}", "figureN": "Figure {0}. {1}", "yontemAd": {"esit": "Equal weights", "dogrudan": "Direct rating", "ahp": "AHP", "bwm": "BWM", "entropi": "Entropy", "critic": "CRITIC", "sd": "Standard deviation", "merec": "MEREC", "topsis": "TOPSIS", "vikor": "VIKOR", "waspas": "WASPAS", "edas": "EDAS", "copras": "COPRAS", "moora": "MOORA", "aras": "ARAS", "mabac": "MABAC", "marcos": "MARCOS", "saw": "SAW"}, "yontemKisa": {"esit": "The same weight for every criterion.", "dogrudan": "The decision maker rates each criterion.", "ahp": "Experts compare criteria in pairs; a consistency ratio is calculated.", "bwm": "Comparisons with the best and worst criterion; fewer judgements than AHP.", "entropi": "More weight to criteria that vary more across alternatives.", "critic": "Combines variability with conflict between criteria.", "sd": "Weights by the standard deviation of normalised values.", "merec": "Looks at how much performance changes when a criterion is removed.", "topsis": "Closest to the positive ideal, farthest from the negative ideal.", "vikor": "A compromise between group utility and individual regret.", "waspas": "Joins the weighted sum and the weighted product model.", "edas": "Positive and negative distances from the average solution.", "copras": "Proportional assessment summing benefit and cost criteria separately.", "moora": "Ratio system with vector normalisation.", "aras": "Utility degree relative to an optimal alternative.", "mabac": "Distance from the border approximation area.", "marcos": "Utility function relative to ideal and anti-ideal solutions.", "saw": "Simple additive weighting; a baseline for comparison."}, "yontemAtif": {"ahp": "Saaty, 1980", "bwm": "Rezaei, 2015", "saw": "Hwang & Yoon, 1981", "topsis": "Hwang & Yoon, 1981", "vikor": "Opricovic & Tzeng, 2004", "moora": "Brauers & Zavadskas, 2006", "waspas": "Zavadskas et al., 2012", "edas": "Keshavarz Ghorabaee et al., 2015", "copras": "Zavadskas et al., 1994", "aras": "Zavadskas & Turskis, 2010", "mabac": "Pamučar & Ćirović, 2015", "marcos": "Stević et al., 2020"}, "yontemAcik": {"entropi": "<p>The <b>Entropy<\/b> method computes weights from the decision matrix, without expert judgement.<\/p><ol><li>Each column is divided by its sum: pᵢⱼ = xᵢⱼ / Σxᵢⱼ.<\/li><li>Entropy of each criterion: Eⱼ = -(1/ln m) Σ pᵢⱼ ln pᵢⱼ.<\/li><li>Degree of diversification dⱼ = 1 - Eⱼ; weight wⱼ = dⱼ / Σdⱼ.<\/li><\/ol><p>A criterion on which alternatives are alike gets a low weight; one on which they differ a lot gets a high weight. Values must not be negative.<\/p>", "critic": "<p><b>CRITIC<\/b> (Diakoulaki et al., 1995) measures the information a criterion carries by its variability and its conflict with the other criteria.<\/p><ol><li>The matrix is min-max normalised according to criterion direction.<\/li><li>The standard deviation σⱼ of each criterion and the Pearson correlations rⱼₖ between criteria are calculated.<\/li><li>Cⱼ = σⱼ Σₖ (1 - rⱼₖ); wⱼ = Cⱼ / ΣCⱼ.<\/li><\/ol><p>Criteria that are highly correlated with others, that is repeat the same information, lose weight.<\/p>", "sd": "<p>The <b>standard deviation<\/b> method (Deng et al., 2000) min-max normalises the decision matrix according to criterion direction and uses each criterion's standard deviation as its weight: wⱼ = σⱼ / Σσⱼ.<\/p><p>Criteria with a wider spread of values get more weight.<\/p>", "merec": "<p><b>MEREC<\/b> (Keshavarz-Ghorabaee et al., 2021) looks at how much removing each criterion changes the overall performance of the alternatives.<\/p><ol><li>Normalisation: min/x for benefit, x/max for cost.<\/li><li>Overall performance: Sᵢ = ln(1 + (1/n) Σⱼ |ln nᵢⱼ|).<\/li><li>With criterion j removed: S'ᵢⱼ is computed with the same formula without j.<\/li><li>Removal effect Eⱼ = Σᵢ |S'ᵢⱼ - Sᵢ|; wⱼ = Eⱼ / ΣEⱼ.<\/li><\/ol><p>All values must be greater than zero.<\/p>"}, "saaty": {"1": "equally important", "2": "between equal and moderate", "3": "moderately more important", "4": "between moderate and strong", "5": "strongly more important", "6": "between strong and very strong", "7": "very strongly more important", "8": "between very strong and extreme", "9": "extremely more important"}, "atif": {"dugme": "Cite", "baslik": "How do I cite this tool?", "ne": "If you used Karar Masası, please cite it in your method section. This supports its development and keeps it free.", "kopyala": "Copy", "apa": "APA 7", "isnad": "ISNAD 2", "bibtex": "BibTeX", "yazilim": "Computer software", "surum": "Version", "buSurum": "(version {0})", "tumSurum": "(all versions)", "digerBicim": "ISNAD and BibTeX formats"}, "yontem": {"baslik": "Draft text for the method section", "not": "The text below is generated from the calculations. Adapt and review it before using it in your work.", "kaynakca": "References", "ve": "and", "p1": "In this study, {m} alternatives were evaluated against {n} criteria with a multi-criteria decision-making (MCDM) approach. The criteria are: {krit}. {f} of them are benefit criteria (higher is preferred) and {c} are cost criteria (lower is preferred).", "ahpTek": "Criterion weights were determined with the Analytic Hierarchy Process (AHP; Saaty, 1980). Criteria were compared in pairs on Saaty's 1-9 scale and the weights were derived from the principal eigenvector of the comparison matrix. The consistency ratio of the matrix was CR = {cr}", "ahpAij": "Criterion weights were determined with the Analytic Hierarchy Process (AHP; Saaty, 1980). {u} experts compared the criteria in pairs on Saaty's 1-9 scale, and their judgements were combined into a single group matrix by geometric mean (Aczél & Saaty, 1983). Weights were derived from the principal eigenvector of the group matrix. The experts' consistency ratios ranged from {min} to {max}; the consistency ratio of the group matrix was CR = {cr}", "ahpAip": "Criterion weights were determined with the Analytic Hierarchy Process (AHP; Saaty, 1980). {u} experts compared the criteria in pairs on Saaty's 1-9 scale; each expert's priorities were computed separately with the eigenvector method and then combined by geometric mean and normalised (Aczél & Saaty, 1983). The experts' consistency ratios ranged from {min} to {max}; the highest value was CR = {cr}", "crIyi": "; since this is below the 0.10 threshold, the judgements were considered consistent.", "crKotu": "; since this exceeds the 0.10 threshold, the judgements should be reviewed.", "bwmTek": "Criterion weights were determined with the Best-Worst Method (BWM; Rezaei, 2015). The decision maker identified the most and least important criteria and compared the other criteria with these two on a 1-9 scale. Weights were obtained with the linear BWM model (Rezaei, 2016); the model's inconsistency was ξᴸ = {xi} and the input-based consistency ratio was CRᴵ = {cri} (Liang et al., 2020).", "bwmCok": "Criterion weights were determined with the Best-Worst Method (BWM; Rezaei, 2015). Each of the {u} experts identified the most and least important criteria and compared the others with these two on a 1-9 scale. Each expert's weights were obtained with the linear BWM model (Rezaei, 2016), and the group weights were taken as the arithmetic mean of the expert weights. The experts' inconsistency values (ξᴸ) were {xi} and their input-based consistency ratios (CRᴵ) were {cri}, respectively (Liang et al., 2020).", "bwmEsikIyi": "These values are below the thresholds proposed by Liang et al. (2020).", "bwmEsikIyiTek": "This value is below the threshold proposed by Liang et al. (2020).", "bwmEsikAsan": "The consistency ratio of {k} expert(s) exceeds the Liang et al. (2020) threshold; reviewing these judgements is recommended.", "w_esit": "All criteria were given equal weights (1/{n} = {e} each).", "w_dogrudan": "Criterion weights were obtained by rescaling the decision maker's scores for each criterion so that they add up to 1.", "w_entropi": "Criterion weights were computed objectively with the Entropy method, based on the information carried by the values in the decision matrix (Shannon, 1948). Criteria that differ more across the alternatives received higher weights.", "w_critic": "Criterion weights were computed objectively with the CRITIC method (Diakoulaki et al., 1995), which takes into account both the standard deviation of each criterion and its conflict with the other criteria.", "w_sd": "Criterion weights were computed objectively with the standard deviation method, based on the standard deviation of each criterion in the min-max normalised decision matrix (Deng et al., 2000).", "w_merec": "Criterion weights were computed objectively with the MEREC method (Keshavarz-Ghorabaee et al., 2021), which measures how much the overall performance of the alternatives changes when each criterion is removed.", "wSonuc": "The highest weight, {w1}, belongs to {k1} and the lowest, {w2}, to {k2}.", "siraTek": "The alternatives were ranked with {liste}.", "siraCok": "To see whether the results depend on the method, the alternatives were ranked with {liste}.", "vikorV": "In VIKOR the weight of the strategy was set to v = {v}.", "waspasL": "In WASPAS the joint coefficient was set to λ = {l}.", "anaSonuc": "According to {y}, the best alternative is {a1}, followed by {a2}; {son} is ranked last.", "vikorUzlasi": "VIKOR's acceptable advantage condition was {c1} and its acceptable stability condition was {c2}; the compromise solution set is {u}.", "saglandi": "met", "saglanmadi": "not met", "spearman": "Agreement between the rankings of the methods was examined with Spearman's rank correlation coefficient (Spearman, 1904); the coefficients ranged from {min} to {max}.", "ayniIlk": "All methods ranked {a} first.", "farkliIlk": "The methods disagree on the first-ranked alternative, so the results should be interpreted with care.", "duyarlilik": "To test the sensitivity of the results to the weights, the weight of each criterion was changed by {o} with {y}, and the other weights were adjusted proportionally so that they still add up to 1. {a} remained first in {k} of the {n} scenarios; the lowest Spearman coefficient between the base ranking and the scenario rankings was {rho}.", "duyarlilikHepsi": "To test the sensitivity of the results to the weights, the weight of each criterion was changed by {o} with {y}, and the other weights were adjusted proportionally so that they still add up to 1. {a} remained first in all {n} scenarios; the lowest Spearman coefficient between the base ranking and the scenario rankings was {rho}.", "arac": "Calculations were performed with Karar Masası (Çetin, 2026)."}, "giris": {"baslik": "Every step of multi-criteria decision making, on one page.", "alt": "Paste the decision matrix from Excel, find criterion weights with AHP, BWM or objective methods, and rank the alternatives with ten methods. Every step's table, a sensitivity analysis and a draft method section come ready in a Word report. No installation, no sign-up; your data stay on your computer.", "ornekNot": "Open the sample project to see what it does: five candidate warehouse sites, five criteria, AHP judgements from three experts. The data are fictional.", "demoUst": "Live calculation from the sample project", "demoAgirlik": "Criterion weights (AHP, 3 experts)", "demoSira": "TOPSIS ranking", "demoAlt": "Consistency ratio of the group matrix CR = {cr}. All numbers were just calculated in this browser.", "devam": "Where you left off", "devamBtn": "Continue", "neBaslik": "What is it for?", "ne1": "Decisions that weigh several criteria at once, such as choosing a supplier, a site, a project, an investment or a policy, are usually studied with multi-criteria decision-making (MCDM) methods. Reviewers of such studies ask for the table of every step, consistency values and a check of the results with different methods.", "ne2": "Karar Masası does this without building formulas by hand in Excel. It links weighting and ranking methods, shows every intermediate table, compares methods with Spearman's coefficient and measures how much the ranking moves when the weights change.", "adimBaslik": "Results in five steps", "adimlar": [["Decision matrix", "Enter alternatives and criteria or paste them from Excel; mark each criterion as benefit or cost."], ["Weights", "Find weights from expert judgement (AHP, BWM, direct rating) or from the data (Entropy, CRITIC, MEREC, standard deviation)."], ["Ranking", "Pick the methods you want; every intermediate step of each method opens as a table."], ["Comparison and sensitivity", "See how well the methods agree and how robust the ranking is to changes in the weights."], ["Report", "Get a Word report, an Excel workbook and a draft method section with references."]], "yontemBaslik": "Methods", "agirlikBaslik": "Weighting (8 methods)", "siraBaslik": "Ranking (10 methods)", "ozBaslik": "Highlights", "ozGruplar": [["Expert judgement", ["AHP with several experts; geometric mean of judgements or of priorities", "A consistency ratio for each expert and a suggestion for the most inconsistent judgement", "Linear BWM; ξ and input-based consistency with the Liang et al. (2020) thresholds"]], ["Calculation and checks", ["Ten ranking methods, each with all intermediate tables", "Compromise solution and both acceptance conditions in VIKOR", "Spearman correlation and weight scenarios for sensitivity analysis"]], ["Output", ["A Word report with numbered tables and figures", "An Excel workbook with every intermediate table", "A draft method section with citations and an APA reference list"]]], "kimBaslik": "Who is it for?", "kimler": ["Graduate students applying MCDM in a thesis or paper.", "Lecturers who want to show the steps in methods courses.", "Researchers and reviewers who want to recalculate a study's results quickly.", "Organisations that need to justify a supplier, project or site choice."], "guvenBaslik": "Privacy and accuracy", "guven": ["The tool is a single HTML file and runs entirely in your browser. It does not connect to the internet; your data stay on your computer.", "The calculations were verified against the open-source pymcdm library and numpy/scipy on hundreds of randomly generated problems. The source code is open; every intermediate table can be checked by hand."], "basla": "Ready when you are."}, "helpTitle": {"genel": "How to use Karar Masası"}, "helpBody": {"genel": "<p><b>1. Decision matrix.<\/b> Rows are alternatives, columns are criteria. Under each criterion choose <b>Benefit<\/b> (higher is better) or <b>Cost<\/b> (lower is better). You can copy a block from Excel and paste it into any cell, or use <b>Paste table<\/b> to bring it in with its headers.<\/p><p><b>2. Weights.<\/b> Choose a method. For AHP and BWM enter the judgements of each expert; the objective methods (Entropy, CRITIC, standard deviation, MEREC) are calculated from the matrix automatically.<\/p><p><b>3. Ranking.<\/b> Tick the methods you want. The main method is the one highlighted in the summary and the report.<\/p><p><b>4. Comparison and sensitivity.<\/b> See how well the methods agree and how much the result moves when the weights change.<\/p><p><b>5. Report.<\/b> Get a Word report, an Excel workbook and a draft method section.<\/p><p>Everything is saved in this browser. Use <b>Project &gt; Download project file<\/b> to back up or move to another computer. <kbd>Ctrl<\/kbd>+<kbd>Z<\/kbd> undoes.<\/p>"}, "ipucu": {"matris": "<p>In the decision matrix each row is an <b>alternative<\/b> (option) and each column a <b>criterion<\/b>. A cell holds the alternative's value on that criterion.<\/p><p>Qualitative criteria can be turned into numbers with a score such as 1-10.<\/p>", "matrisTus": "<p><kbd>Enter<\/kbd> or <kbd>↓<\/kbd> moves down, <kbd>↑<\/kbd> moves up. <kbd>Enter<\/kbd> on the last row adds a new alternative.<\/p><p>Use a comma or a point for decimals, or write a fraction such as <code>1/3<\/code>.<\/p>", "istatistik": "<p>Minimum, maximum, mean, standard deviation and coefficient of variation (std. dev. / mean) of each criterion. A criterion with a very small coefficient of variation hardly distinguishes the alternatives.<\/p>", "iceAktar": "<p>For Excel (.xlsx) files the first sheet is read. For CSV files the separator (comma, semicolon, tab) is detected automatically.<\/p><p>Expected layout:<\/p><ul><li>Row 1: criterion names<\/li><li>Row 2 (optional): benefit or cost<\/li><li>Column 1: alternative names<\/li><\/ul>", "agirlik": "<p><b>Subjective<\/b> methods use the opinion of the decision maker or experts (AHP, BWM, direct rating).<\/p><p><b>Objective<\/b> methods look only at the data in the decision matrix (Entropy, CRITIC, standard deviation, MEREC). If the data change, so do the weights.<\/p>", "ahpUzman": "<p>Each expert has their own set of pairwise comparisons. For privacy you can use codes such as E1, E2 instead of names.<\/p><p>With several experts the judgements are combined; choose how below.<\/p>", "ahpBirlestir": "<p><b>AIJ<\/b>: the geometric mean of the experts' judgements is taken for each cell, giving one group matrix. Recommended when the experts act as a group.<\/p><p><b>AIP<\/b>: each expert's priorities are calculated separately and then averaged geometrically. Used when the experts are treated as independent individuals.<\/p>", "bwmUzman": "<p>Each expert first chooses the most important (best) and the least important (worst) criterion. Then they rate, from 1 to 9, how much more important the best is than each criterion, and how much more important each criterion is than the worst.<\/p><p>Only 2n - 3 judgements are needed for n criteria.<\/p>", "sirala": "<p>Each method gives the alternatives a score and ranks them by it. For most methods a higher score is better; in VIKOR a lower Q is better.<\/p><p>Different methods rest on different assumptions; using several together shows how robust the result is.<\/p>", "yontemSec": "<p>Click methods to turn them on or off. At least one stays selected.<\/p><p>WASPAS, COPRAS, ARAS, MARCOS and SAW need all values to be greater than zero.<\/p>", "anaYontem": "<p>The method highlighted in the summary, the chart, the sensitivity analysis (unless another is chosen) and the method text.<\/p>", "vikorV": "<p>v is the weight of group utility (S); 1 - v is the weight of individual regret (R). Usually v = 0.5 (consensus).<\/p>", "waspasL": "<p>λ is the share of the weighted sum model (WSM); 1 - λ is the share of the weighted product model (WPM). Usually λ = 0.5.<\/p>", "karsilastir": "<p>The ranks given by different methods on the same data and weights are shown side by side. Mean rank and overall rank summarise them.<\/p>", "siraTablo": "<p>The darker the colour, the better the rank. Rows are ordered by overall rank.<\/p>", "spearman": "<p>Spearman's coefficient shows how similar two rankings are: 1 is identical, 0 unrelated, -1 fully reversed. Above 0.8 is usually considered strong agreement.<\/p><p>Tied ranks use the average rank.<\/p>", "duyarlilik": "<p>Weights are often uncertain. Sensitivity analysis shows how much the ranking changes when one criterion's weight changes.<\/p><p>The changed criterion's new weight is w(1 + change); the others shrink or grow by the same factor so that the total stays 1.<\/p>", "dOran": "<p>Enter percentages separated by commas or spaces: <code>-50, -25, 25, 50<\/code>. Each change produces a separate scenario for each criterion.<\/p>", "dTablo": "<p>Ranks that differ from the base case are highlighted. ρ is the Spearman coefficient between the scenario ranking and the base ranking.<\/p>", "rapor": "<p><b>Word report<\/b>: decision matrix, weights, each method's tables, comparison, sensitivity, method text and references, with numbered tables and figures.<\/p><p><b>Excel<\/b>: each method on its own sheet with every intermediate table. Numbers are written as values so you can check them with your own formulas.<\/p>", "yontemMetni": "<p>This text is rewritten after every change, according to the methods and results. Citations and references cover only the methods used.<\/p>", "ayarlar": "<p>The number of decimal places affects the tables on screen and in the report; calculations always use full precision.<\/p>", "y_topsis": "<p>After vector normalisation, each alternative's distance to the positive ideal (S⁺) and negative ideal (S⁻) is calculated. Closeness coefficient C* = S⁻ / (S⁺ + S⁻); higher is better.<\/p>", "y_vikor": "<p>S is group utility and R individual regret. Q combines them weighted by v; a lower Q is better.<\/p><p>Two conditions must hold for the first alternative to be a clear solution; otherwise a compromise set is given.<\/p>", "y_waspas": "<p>After linear normalisation the weighted sum (WSM) and weighted product (WPM) are calculated and joined with λ.<\/p>", "y_edas": "<p>Each criterion's average (AV) is found; distances above (PDA) and below (NDA) the average in the good direction are weighted. A higher appraisal score AS is better.<\/p>", "y_copras": "<p>Values are divided by the column sum and weighted. Benefit (S⁺) and cost (S⁻) sums are kept separately; a higher relative significance Q is better. The utility degree is a percentage of the best.<\/p>", "y_moora": "<p>After vector normalisation, weighted benefit values are added and cost values subtracted. A higher y* is better.<\/p>", "y_aras": "<p>An optimal alternative made of each criterion's best value is added. Each alternative's total is divided by the optimal one; the closer the utility degree K is to 1, the better.<\/p>", "y_mabac": "<p>A border area (G) is found for each criterion as the geometric mean of the alternatives. A higher total distance S from this border is better.<\/p>", "y_marcos": "<p>Ideal (AI) and anti-ideal (AAI) solutions are added to the matrix. The alternatives' utility degrees relative to them (K⁺, K⁻) are combined in a utility function; a higher f(K) is better.<\/p>", "y_saw": "<p>The weighted sum of linearly normalised values. The simplest method and a reference point for the others.<\/p>"}}, "tr": {"_kod": "tr", "_ad": "Türkçe", "_cevirmen": "Behiç Çetin", "untitled": "Adsız karar problemi", "project": "Proje", "projectName": "Proje adı", "tabHome": "Ana sayfa", "tabMatrix": "Karar matrisi", "tabWeights": "Ağırlıklar", "tabRanking": "Sıralama", "tabCompare": "Karşılaştırma", "tabSensitivity": "Duyarlılık", "tabReport": "Rapor", "undo": "Geri al (Ctrl+Z)", "redo": "Yinele (Ctrl+Y)", "undone": "Geri alındı.", "redone": "Yinelendi.", "language": "Dil", "theme": "Açık ya da koyu tema", "help": "Yardım", "whatIsThis": "Bu nedir?", "menuFile": "Dosya", "menuTools": "Araçlar", "newProject": "Yeni proje", "openProject": "Proje dosyası aç", "saveProject": "Proje dosyasını indir", "loadSample": "Örnek projeyi aç", "importMatrix": "Excel ya da CSV içe aktar", "toolSettings": "Ayarlar", "toolLog": "İşlem günlüğü", "languageFiles": "Dil dosyaları", "langTemplate": "Çeviri şablonunu indir", "langLoad": "Dil dosyası yükle", "langBad": "Dil dosyası okunamadı. _kod ve _ad alanları gerekli.", "langLoaded": "{0} yüklendi.", "langMissing": "{0} metin çevrilmemiş; bunlar İngilizce görünecek.", "otherTab": "Bu proje başka bir sekmede de açık. Veri kaybını önlemek için bu sekme kilitlendi.", "reload": "Yeniden yükle", "saved": "Kaydedildi", "saveFail": "Tarayıcıya kaydedilemedi. Proje dosyasını indirerek yedek alın.", "privacy": "Verileriniz bu tarayıcıdan dışarı çıkmaz: hiçbir sunucuya gönderilmez, yalnızca bu bilgisayarda saklanır. Düzenli olarak proje dosyasını indirip yedek alın.", "credit": "Sistem mimarı ve geliştirici:", "license": "MIT Lis yum Spearman sıra korelasyon katsayısıyla incelenmiş (Spearman, 1904); katsayılar {min} ile {max} arasında bulunmuştur.", "ayniIlk": "Bütün yöntemler {a} alternatifini ilk sıraya yerleştirmiştir.", "farkliIlk": "Yöntemler ilk sıradaki alternatif konusunda ayrışmıştır; bu nedenle sonuçlar dikkatle yorumlanmalıdır.", "duyarlilik": "Sonuçların ağırlıklardaki değişime duyarlılığını sınamak için {y} yönteminde her kriterin ağırlığı {o} oranlarında değiştirilmiş, diğer kriterlerin ağırlıkları toplam 1 olacak biçimde orantılı olarak ayarlanmıştır. {n} senaryonun {k} tanesinde {a} ilk sırada kalmış; temel sıralama ile senaryo sıralamaları arasındaki en düşük Spearman katsayısı {rho} olmuştur.", "duyarlilikHepsi": "Sonuçların ağırlıklardaki değişime duyarlılığını sınamak için {y} yönteminde her kriterin ağırlığı {o} oranlarında değiştirilmiş, diğer kriterlerin ağırlıkları toplam 1 olacak biçimde orantılı olarak ayarlanmıştır. {n} senaryonun tamamında {a} ilk sırada kalmış; temel sıralama ile senaryo sıralamaları arasındaki en düşük Spearman katsayısı {rho} olmuştur.", "arac": "Hesaplamalar Karar Masası (Çetin, 2026) ile yapılmıştır."}, "giris": {"baslik": "Çok kriterli karar vermenin bütün adımları, tek sayfada.", "alt": "Karar matrisini Excel'den yapıştırın; kriter ağırlıklarını AHP, BWM ya da nesnel yöntemlerle bulun; alternatifleri on yöntemle sıralayın. Her adımın tablosu, duyarlılık analizi ve yöntem bölümü taslağı Word raporunda hazır gelir. Kurulum ve üyelik yok; veriler bilgisayarınızdan çıkmaz.", "ornekNot": "Ne yaptığını görmek için örnek projeyi açın: beş aday depo yeri, beş kriter, üç uzmanın AHP yargıları. Veriler kurgusaldır.", "demoUst": "Örnek projeden canlı hesap", "demoAgirlik": "Kriter ağırlıkları (AHP, 3 uzman)", "demoSira": "TOPSIS sıralaması", "demoAlt": "Grup matrisinin tutarlılık oranı CR = {cr}. Bütün sayılar şu anda bu tarayıcıda hesaplandı.", "devam": "Kaldığınız yer", "devamBtn": "Devam et", "neBaslik": "Ne işe yarar?", "ne1": "Tedarikçi, yer, pro sansüstü öğrenciler: tez ve makalede ÇKKV uygulayanlar.", "Öğretim elemanları: yöntem derslerinde adımları göstermek isteyenler.", "Araştırmacılar ve hakemler: bir çalışmanın sonuçlarını hızla yeniden hesaplamak isteyenler.", "Kurumlar: tedarikçi, proje ya da yer seçimini gerekçelendirmek isteyenler."], "guvenBaslik": "Gizlilik ve doğruluk", "guven": ["Araç tek bir HTML dosyasıdır ve tamamen tarayıcınızda çalışır. İnternete bağlanmaz; verileriniz bilgisayarınızda kalır.", "Hesaplar, rastgele üretilmiş yüzlerce problemde açık kaynak pymcdm kütüphanesi ve numpy/scipy ile karşılaştırılarak doğrulanmıştır. Kaynak kodu açıktır; her ara tablo kendi hesabınızla kontrol edilebilir."], "basla": "Hazırsanız başlayın."}, "helpTitle": {"genel": "Karar Masası nasıl kullanılır?"}, "helpBody": {"genel": "<p><b>1. Karar matrisi.<\/b> Satırlar alternatifler, sütunlar kriterlerdir. Her kriterin altında <b>Fayda<\/b> (yüksek değer iyi) ya da <b>Maliyet<\/b> (düşük değer iyi) seçin. Excel'den bir bloğu kopyalayıp herhangi bir hücreye yapıştırabilir ya da <b>Tablo yapıştır<\/b> ile başlıklarıyla birlikte alabilirsiniz.<\/p><p><b>2. Ağırlıklar.<\/b> Bir yöntem seçin. AHP ve BWM'de her uzman için yargıları girin; nesnel yöntemler (ENTROPİ, CRITIC, standart sapma, MEREC) matristen kendiliğinden hesaplanır.<\/p><p><b>3. Sıralama.<\/b> Kullanmak istediğiniz yöntemleri işaretleyin. Ana yöntem, özette ve raporda öne çıkan yöntemdir.<\/p><p><b>4. Karşılaştırma ve duyarlılık.<\/b> Yöntemlerin ne kadar uyuştuğunu ve ağırlıklar değişince sonucun ne kadar oynadığını görün.<\/p><p><b>5. Rapor.<\/b> Word raporu, Excel çalışma kitabı ve yöntem bölümü taslağı alın.<\/p><p>Bütün işler bu tarayıcıda kaydedilir. Başka bilgisayara taşımak ya da yedeklemek için <b>Proje &gt; Proje dosyasını indir<\/b> kullanın. <kbd>Ctrl<\/kbd>+<kbd>Z<\/kbd> geri alır.<\/p>"}, "ipucu": {"matris": "<p>Karar matrisinde her satır bir <b>alternatif<\/b> (seçenek), her sütun bir <b>kriter<\/b>dir (ölçüt). Hücreye alternatifin o kriterdeki değeri yazılır.<\/p><p>Nitel kriterleri 1-10 gibi bir puanla sayısallaştırabilirsiniz.<\/p>", "matrisTus": "<p><kbd>Enter<\/kbd> ya da <kbd>↓<\/kbd> alt hücreye, <kbd>↑<\/kbd> üst hücreye geçer. Son satırda <kbd>Enter<\/kbd> yeni alternatif ekler.<\/p><p>Ondalık için virgül ya da nokta, kesir için <code>1/3<\/code> yazabilirsiniz.<\/p>", "istatistik": "<p>Her kriterin en küçük, en büyük, ortalama değeri, standart sapması ve değişim katsayısı (std. sapma / ortalama). Değişim katsayısı çok küçük olan bir kriter alternatifleri neredeyse hiç ayırt etmez.<\/p>", "iceAktar": "<p>Excel (.xlsx) dosyasında ilk sayfa okunur. CSV dosyalarında ayıraç (virgül, noktalı virgül, sekme) kendiliğinden bulunur.<\/p><p>Beklenen düzen:<\/p><ul><li>1. satır: kriter adları<\/li><li>2. satır (isteğe bağlı): fayda ya da maliyet<\/li><li>1. sütun: alternatif adları<\/li><\/ul>", "agirlik": "<p><b>Öznel<\/b> yöntemler karar vericinin ya da uzmanların görüşünü kullanır (AHP, BWM, doğrudan puan).<\/p><p><b>Nesnel<\/b> yöntemler yalnızca karar matrisindeki verilere bakar (ENTROPİ, CRITIC, standart sapma, MEREC). Veri değişirse ağırlıklar da değişir.<\/p>", "ahpUzman": "<p>Her uzman için ayrı bir ikili karşılaştırma seti girilir. Gizlilik için ad yerine U1, U2 gibi kodlar kullanabilirsiniz.<\/p><p>Birden çok uzman varsa yargılar birleştirilir; yöntemini aşağıdan seçin.<\/p>", "ahpBirlestir": "<p><b>AIJ<\/b>: Uzmanların her hücredeki yargılarının geometrik ortalaması alınır ve tek bir grup matrisi kurulur. Uzmanlar bir grup gibi davranıyorsa önerilir.<\/p><p><b>AIP<\/b>: Her uzmanın ağırlıkları ayrı hesaplanır, sonra geometrik ortalaması alınır. Uzmanlar birbirinden bağımsız bireyler olarak değerlendiriliyorsa kullanılır.<\/p>", "bwmUzman": "<p>Her uzman önce en önemli (en iyi) ve en önemsiz (en kötü) kriteri seçer. Sonra en iyinin her kritere göre ne kadar önemli olduğunu ve her kriterin en kötüye göre ne kadar önemli olduğunu 1-9 arasında puanlar.<\/p><p>n kriter için yalnızca 2n - 3 yargı gerekir.<\/p>", "sirala": "<p>Her yöntem alternatiflere bir puan verir ve puana göre sıralar. Çoğu yöntemde yüksek puan iyidir; VIKOR'da düşük Q iyidir.<\/p><p>Farklı yöntemler farklı varsayımlara dayanır; birkaçını birlikte kullanmak sonucun sağlamlığını gösterir.<\/p>", "yontemSec": "<p>Yöntemleri tıklayarak açıp kapatın. En az bir yöntem seçili kalır.<\/p><p>WASPAS, COPRAS, ARAS, MARCOS ve SAW bütün değerlerin sıfırdan büyük olmasını ister.<\/p>", "anaYontem": "<p>Özette, ana sayfadaki grafikte, duyarlılık analizinde (başka seçilmemişse) ve yöntem metninde öne çıkan yöntem.<\/p>", "vikorV": "<p>v, grup faydasının (S) ağırlığıdır; 1 - v ise en kötü bireysel pişmanlığın (R) ağırlığıdır. Genellikle v = 0,5 alınır (uzlaşma).<\/p>", "waspasL": "<p>λ, ağırlıklı toplam modelinin (WSM) payıdır; 1 - λ ağırlıklı çarpım modelinin (WPM) payıdır. Genellikle λ = 0,5 alınır.<\/p>", "karsilastir": "<p>Aynı veri ve ağırlıklarla farklı yöntemlerin verdiği sıralar yan yana konur. Ortalama sıra ve genel sıra, yöntemlerin ortak bir özetidir.<\/p>", "siraTablo": "<p>Renk koyulaştıkça sıra iyileşir. Satırlar genel sıraya göre dizilidir.<\/p>", "spearman": "<p>Spearman katsayısı iki sıralamanın ne kadar benzediğini gösterir: 1 aynı sıralama, 0 ilişkisiz, -1 tam ters. 0,8 üstü genellikle güçlü uyum sayılır.<\/p><p>Bağlı sıralarda ortalama sıra kullanılır.<\/p>", "duyarlilik": "<p>Ağırlıklar çoğunlukla belirsizdir. Duyarlılık analizi, bir kriterin ağırlığı değişince sıralamanın ne kadar değiştiğini gösterir.<\/p><p>Değiştirilen kriterin yeni ağırlığı w(1 + oran) olur; diğerleri toplam 1 kalacak biçimde aynı oranda küçülür ya da büyür.<\/p>", "dOran": "<p>Virgül ya da boşlukla ayırarak yüzde yazın: <code>-50, -25, 25, 50<\/code>. Her kriter için her oran ayrı bir senaryo üretir.<\/p>", "dTablo": "<p>Temel durumdan farklı olan sıralar işaretlidir. ρ, senaryonun sıralaması ile temel sıralama arasındaki Spearman katsayısıdır.<\/p>", "rapor": "<p><b>Word raporu<\/b>: karar matrisi, ağırlıklar, her yöntemin tabloları, karşılaştırma, duyarlılık, yöntem metni ve kaynakça; tablolar ve şekiller numaralıdır.<\/p><p><b>Excel<\/b>: her yöntem ayrı bir sayfada, bütün ara tablolarla. Sayılar değer olarak yazılır; kendi formüllerinizle kontrol edebilirsiniz.<\/p>", "yontemMetni": "<p>Bu metin seçtiğiniz yöntemlere ve sonuçlara göre her değişiklikte yeniden yazılır. Atıflar ve kaynakça yalnızca kullanılan yöntemleri içerir.<\/p>", "ayarlar": "<p>Ondalık basamak sayısı ekrandaki tabloları ve raporu etkiler; hesaplar her zaman tam duyarlıkla yapılır.<\/p>", "y_topsis": "<p>Vektör normalleştirmesinden sonra her alternatifin pozitif ideale (S⁺) ve negatif ideale (S⁻) uzaklığı hesaplanır. Yakınlık katsayısı C* = S⁻ / (S⁺ + S⁻); yüksek olan iyidir.<\/p>", "y_vikor": "<p>S grup faydası, R en kötü bireysel pişmanlıktır. Q bu ikisinin v ile ağırlıklı birleşimidir; düşük Q iyidir.<\/p><p>İlk sıradaki alternatifin kesin çözüm sayılması için iki koşul aranır; sağlanmazsa uzlaşık çözüm kümesi verilir.<\/p>", "y_waspas": "<p>Doğrusal normalleştirmeden sonra ağırlıklı toplam (WSM) ve ağırlıklı çarpım (WPM) hesaplanır, λ ile birleştirilir.<\/p>", "y_edas": "<p>Her kriterin ortalaması (AV) bulunur; alternatiflerin ortalamadan iyi yöndeki (PDA) ve kötü yöndeki (NDA) uzaklıkları ağırlıklandırılır. Değerlendirme puanı AS yüksek olan iyidir.<\/p>", "y_copras": "<p>Değerler sütun toplamına bölünüp ağırlıklandırılır. Fayda (S⁺) ve maliyet (S⁻) toplamları ayrı tutulur; göreli önem Q yüksek olan iyidir. Fayda derecesi en iyiye göre yüzdedir.<\/p>", "y_moora": "<p>Vektör normalleştirmesinden sonra ağırlıklı fayda değerleri toplanır, maliyet değerleri çıkarılır. y* yüksek olan iyidir.<\/p>", "y_aras": "<p>Her kriterin en iyi değerinden oluşan optimal bir alternatif eklenir. Her alternatifin toplam puanı optimalinkine bölünür; fayda derecesi K, 1'e yaklaştıkça iyidir.<\/p>", "y_mabac": "<p>Her kriter için alternatiflerin geometrik ortalamasından bir sınır alanı (G) bulunur. Alternatifin bu sınıra toplam uzaklığı S yüksek olan iyidir.<\/p>", "y_marcos": "<p>İdeal (AI) ve anti-ideal (AAI) çözümler matrise eklenir. Alternatiflerin bu ikisine göre fayda dereceleri (K⁺, K⁻) bir fayda fonksiyonunda birleşir; f(K) yüksek olan iyidir.<\/p>", "y_saw": "<p>Doğrusal normalleştirilmiş değerlerin ağırlıklı toplamı. En basit yöntemdir; diğerleri için bir karşılaştırma noktasıdır.<\/p>"}}};</script>

function projeDuzelt(p){const b=bosProje();p.v=1;p.ad=p.ad||b.ad;
  p.kriterler=(Array.isArray(p.kriterler)?p.kriterler:[]).filter(k=>k&&k.id).map(k=>({id:String(k.id),ad:String(k.ad??''),yon:k.yon==='min'?'min':'max',birim:String(k.birim??'')}));

  p.X=p.X&&typeof p.X==='object'?p.X:{};const ks=new Set(p.kriterler.map(k=>k.id));
  p.alternatifler.forEach(a=>{const s=p.X[a.id]&&typeof p.X[a.id]==='object'?p.X[a.id]:{};const o={};for(const k of ks){const v=s[k];o[k]=typeof v==='number'&&isFinite(v)?v:null}p.X[a.id]=o});
  for(const k of Object.keys(p.X))if(!p.alternatifler.some(a=>a.id===k))delete p.X[k];
  p.agirlik=Object.assign({},b.agirlik,p.agirlik||{});if(!AGIRLIK_YONTEM.includes(p.agirlik.yontem))p.agirlik.yontem='esit';
  p.agirlik.dogrudan=p.agirlik.dogrudan&&typeof p.agirlik.dogrudan==='object'?p.agirlik.dogrudan:{};
  p.agirlik.ahp=Object.assign({uzmanlar:[],birlestir:'aij'},p.agirlik.ahp||{});p.agirlik.ahp.uzmanlar=(p.agirlik.ahp.uzmanlar||[]).map(u=>({id:u.id||uid(),ad:String(u.ad??''),m:u.m&&typeof u.m==='object'?u.m:{}}));
  if(!['aij','aip'].includes(p.agirlik.ahp.birlestir))p.agirlik.ahp.birlestir='aij';
  p.agirlik.bwm=Object.assign({uzmanlar:[]},p.agirlik.bwm||{});p.agirlik.bwm.uzmanlar=(p.agirlik.bwm.uzmanlar||[]).map(u=>({id:u.id||uid(),ad:String(u.ad??''),en:u.en||null,kotu:u.kotu||null,bo:u.bo||{},ow:u.ow||{}}));
  p.yontemler=(Array.isArray(p.yontemler)?p.yontemler:b.yontemler).filter(y=>SIRALAMA_YONTEM.includes(y));
  if(!SIRALAMA_YONTEM.includes(p.ana))p.ana=p.yontemler[0]||'topsis';
  p.param=Object.assign({},b.param,p.param||{});p.duyarlilik=Object.assign({},b.duyarlilik,p.duyarlilik||{});
  p.ondalik=Math.min(8,Math.max(2,+p.ondalik||4));p.adimRapor=p.adimRapor!==false;p.gunluk=Array.isArray(p.gunluk)?p.gunluk:[];p.rev=p.rev||0;return p}

/* Dilden bağımsız küçültme: I, ı, İ hepsi i olur. Başlık eşleştirmede kullanılır. */
function katla(s){let o='';for(const c of String(s)){if(c==='I'||c==='ı'||c==='İ'){o+='i';continue}const l=c.toLowerCase();o+=l.length===c.length?l:c}return o}
/* Sayı okuma: 1.234,56 ya da 1,234.56 ya da 1/3 biçimlerini anlar. */
function sayiOku(s){if(typeof s==='number')return isFinite(s)?s:null;s=String(s??'').trim().replace(/\s+/g,'').replace(/%$/,'').replace(/^(-?)%/,'$1');if(!s)return null;
  const k=s.match(/^(-?[\d.,]+)\/([\d.,]+)$/);
  /* Binlik ayıraç: Türkçede 1.250, İngilizcede 1,250 biçimi binlik sayılır (0.125 gibi sıfırla başlayanlar ondalıktır). */
  if(S.dil==='tr'&&/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(S.dil!=='tr'&&/^-?[1-9]\d{0,2}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');if(k){const a=sayiOku(k[1]),b=sayiOku(k[2]);return a!=null&&b?a/b:null}
  const v=s.lastIndexOf(','),n=s.lastIndexOf('.');if(v>-1&&n>-1){s=v>n?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(v>-1){s=(s.match(/,/g).length>1)?s.replace(/,/g,''):s.replace(',','.')}else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  if(!/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s))return null;const x=parseFloat(s);return isFinite(x)?x:null}

async function zipAc(buf){const u=new Uint8Array(buf),dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let e=u.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const dec=new TextDecoder(),o={};
  for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;
    const yon=dv.getUint16(p+10,true),cb=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lh=dv.getUint32(p+42,true);
    const ad=dec.decode(u.subarray(p+46,p+46+nl));const ln=dv.getUint16(lh+26,true),lx=dv.getUint16(lh+28,true),bas=lh+30+ln+lx;
    o[ad]={yon,veri:u.subarray(bas,bas+cb)};p+=46+nl+xl+cl}
  o.oku=async ad=>{const f=o[ad];if(!f)return null;const b=f.yon===0?f.veri:new Uint8Array(await new Response(new Blob([f.veri]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return new TextDecoder().decode(b)};
  return o}
const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0}return d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=tb[(c^d[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}})();
function zipYap(files,tip){const enc=new TextEncoder(),parca=[],merkez=[];let off=0;const n=new Date(),dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tm=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);
  for(const f of files){const ad=enc.encode(f.ad),d=typeof f.veri==='string'?enc.encode(f.veri):f.veri,c=CRC(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,ad.length,true);
    parca.push(new Uint8Array(h.buffer),ad,d);
    const m=new DataView(new ArrayBuffer(46));m.setUint32(0,0x02014b50,true);m.setUint16(4,20,true);m.setUint16(6,20,true);m.setUint16(8,0x0800,true);m.setUint16(12,tm,true);m.setUint16(14,dt,true);m.setUint32(16,c,true);m.setUint32(20,d.length,true);m.setUint32(24,d.length,true);m.setUint16(28,ad.length,true);m.setUint32(42,off,true);
    merkez.push(new Uint8Array(m.buffer),ad);off+=30+ad.length+d.length}
  const cs=merkez.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parca,...merkez,new Uint8Array(e.buffer)],{type:tip||'application/zip'})}

function csvSatirlar(m){m=m.replace(/^﻿/,'');const ilk=m.split('\n')[0];const ay=[';','\t',','].sort((a,b)=>ilk.split(b).length-ilk.split(a).length)[0];

function svgPng(svg,olcek=2){return new Promise((res,rej)=>{const kok=svg.match(/<svg[^>]*>/)[0],w=Math.ceil(+kok.match(/\swidth="([\d.]+)"/)[1]),h=Math.ceil(+kok.match(/\sheight="([\d.]+)"/)[1]);const img=new Image();

/* ====================== HESAP ÇEKİRDEĞİ ======================
   Bütün yöntemler aynı girdiyi alır: X (m alternatif x n kriter), yon ('max' fayda, 'min' maliyet), w (ağırlıklar).
   Her yöntem {skor, sira, ort, adimlar} döndürür. adimlar raporda ve ekranda adım adım tablo olarak gösterilir. */
const EPS=1e-12;
const topla=a=>a.reduce((s,x)=>s+x,0);
const sut=(X,j)=>X.map(r=>r[j]);
const enb=a=>Math.max(...a),enk=a=>Math.min(...a);
const ort=a=>topla(a)/a.length;
function ss(a,orneklem=true){const o=ort(a);const n=a.length-(orneklem?1:0);return n>0?Math.sqrt(topla(a.map(x=>(x-o)**2))/n):0}
function pearson(a,b){const oa=ort(a),ob=ort(b);let p=0,qa=0,qb=0;for(let i=0;i<a.length;i++){p+=(a[i]-oa)*(b[i]-ob);qa+=(a[i]-oa)**2;qb+=(b[i]-ob)**2}return qa<EPS||qb<EPS?0:p/Math.sqrt(qa*qb)}
/* Yarışma sıralaması (1, 2, 2, 4). buyukIyi: yüksek puan daha iyi. */
function siraBul(skor,buyukIyi=true){return skor.map((s,i)=>1+skor.filter((x,k)=>k!==i&&(buyukIyi?x>s+1e-10:x<s-1e-10)).length)}
/* Ortalama sıra (bağlarda ortalama): Spearman için. */
function ortSira(skor,buyukIyi=true){return skor.map((s,i)=>{const ust=skor.filter((x,k)=>k!==i&&(buyukIyi?x>s+1e-10:x<s-1e-10)).length;const esit=skor.filter((x,k)=>k!==i&&Math.abs(x-s)<=1e-10).length;return ust+1+esit/2})}
const spearman=(r1,r2)=>pearson(r1,r2);
const adim=(k,sutun,satirlar,not)=>({k,sutun,satirlar,not:not||''});
const matrisAdim=(k,A,C,M,not)=>adim(k,['',...C],M.map((r,i)=>[A[i],...r]),not);
const sonuc=(skor,buyukIyi,adimlar,ek={})=>({skor,sira:siraBul(skor,buyukIyi),ort:ortSira(skor,buyukIyi),buyukIyi,adimlar,...ek});

/* ---------- Normalleştirmeler ---------- */
function normDogrusal(X,yon){const n=X[0].length;const mx=[],mn=[];for(let j=0;j<n;j++){const c=sut(X,j);mx[j]=enb(c);mn[j]=enk(c)}
  return X.map(r=>r.map((x,j)=>yon[j]==='max'?x/mx[j]:mn[j]/x))}
function normVektor(X){const n=X[0].length;const d=[];for(let j=0;j<n;j++)d[j]=Math.sqrt(topla(sut(X,j).map(x=>x*x)));return X.map(r=>r.map((x,j)=>d[j]>EPS?x/d[j]:0))}
function normMinMax(X,yon){const n=X[0].length;const mx=[],mn=[];for(let j=0;j<n;j++){const c=sut(X,j);mx[j]=enb(c);mn[j]=enk(c)}
  return X.map(r=>r.map((x,j)=>{const a=mx[j]-mn[j];if(a<EPS)return 1;return yon[j]==='max'?(x-mn[j])/a:(mx[j]-x)/a}))}
const agirliklandir=(N,w)=>N.map(r=>r.map((x,j)=>x*w[j]));

/* ---------- Veri gereksinimleri ---------- */
const GEREK={topsis:'hepsi',vikor:'hepsi',moora:'hepsi',mabac:'hepsi',edas:'negatifsiz',waspas:'pozitif',copras:'pozitif',aras:'pozitif',marcos:'pozitif',saw:'pozitif',entropi:'negatifsiz',merec:'pozitif'};
function gerekKontrol(X,tur){const v=X.flat();if(tur==='pozitif'&&v.some(x=>x<=0))return 'needPositive';if(tur==='negatifsiz'&&v.some(x=>x<0))return 'needNonNegative';return null}

/* ====================== AĞIRLIK YÖNTEMLERİ ====================== */
const AGIRLIK={
  esit(X,yon,ctx){const n=yon.length;return {w:Array(n).fill(1/n),adimlar:[]}},
  dogrudan(X,yon,ctx){const v=ctx.C.map((c,j)=>Math.max(0,+(ctx.dogrudan[ctx.Cid[j]]??0)||0));const s=topla(v);if(s<=0)return {hata:'directEmpty'};
    const w=v.map(x=>x/s);return {w,adimlar:[adim('stDirect',['',t('colScore'),t('colWeight')],ctx.C.map((c,j)=>[c,v[j],w[j]]))]}},
  entropi(X,yon,ctx){const h=gerekKontrol(X,'negatifsiz');if(h)return {hata:h};const m=X.length,n=yon.length;const cs=[];for(let j=0;j<n;j++){cs[j]=topla(sut(X,j));if(cs[j]<=0)return {hata:'entropyZeroCol'}}
    const p=X.map(r=>r.map((x,j)=>x/cs[j]));const k=1/Math.log(m);const E=[],d=[];
    for(let j=0;j<n;j++){E[j]=-k*topla(sut(p,j).map(x=>x>0?x*Math.log(x):0));d[j]=1-E[j]}const sd=topla(d);if(sd<=EPS)return {hata:'entropyNoDiv'};const w=d.map(x=>x/sd);
    return {w,adimlar:[matrisAdim('stEntropyP',ctx.A,ctx.C,p),adim('stEntropyE',['',t('colEj'),t('colDj'),t('colWeight')],ctx.C.map((c,j)=>[c,E[j],d[j],w[j]]),t('noteEntropy'))]}},
  critic(X,yon,ctx){const n=yon.length;const N=normMinMax(X,yon);const sg=[],r=[],C=[];for(let j=0;j<n;j++)sg[j]=ss(sut(N,j));
    for(let j=0;j<n;j++){r[j]=[];for(let k=0;k<n;k++)r[j][k]=j===k?1:pearson(sut(N,j),sut(N,k))}
    for(let j=0;j<n;j++)C[j]=sg[j]*topla(r[j].map(x=>1-x));const s=topla(C);if(s<=EPS)return {hata:'criticZero'};const w=C.map(x=>x/s);
    return {w,adimlar:[matrisAdim('stMinMax',ctx.A,ctx.C,N),matrisAdim('stCorr',ctx.C,ctx.C,r),adim('stCritic',['',t('colSd'),t('colSum1r'),t('colCj'),t('colWeight')],ctx.C.map((c,j)=>[c,sg[j],topla(r[j].map(x=>1-x)),C[j],w[j]]),t('noteSd'))]}},
  sd(X,yon,ctx){const n=yon.length;const N=normMinMax(X,yon);const sg=[];for(let j=0;j<n;j++)sg[j]=ss(sut(N,j));const s=topla(sg);if(s<=EPS)return {hata:'criticZero'};const w=sg.map(x=>x/s);
    return {w,adimlar:[matrisAdim('stMinMax',ctx.A,ctx.C,N),adim('stSd',['',t('colSd'),t('colWeight')],ctx.C.map((c,j)=>[c,sg[j],w[j]]),t('noteSd'))]}},
  merec(X,yon,ctx){const h=gerekKontrol(X,'pozitif');if(h)return {hata:h};const m=X.length,n=yon.length;const mx=[],mn=[];for(let j=0;j<n;j++){mx[j]=enb(sut(X,j));mn[j]=enk(sut(X,j))}
    const N=X.map(r=>r.map((x,j)=>yon[j]==='max'?mn[j]/x:x/mx[j]));const Si=N.map(r=>Math.log(1+topla(r.map(x=>Math.abs(Math.log(x))))/n));
    const Sp=N.map(r=>r.map((_,j)=>Math.log(1+topla(r.map((x,k)=>k===j?0:Math.abs(Math.log(x))))/n)));
    const E=[];for(let j=0;j<n;j++)E[j]=topla(Sp.map((r,i)=>Math.abs(r[j]-Si[i])));const s=topla(E);if(s<=EPS)return {hata:'criticZero'};const w=E.map(x=>x/s);
    return {w,adimlar:[matrisAdim('stMerecN',ctx.A,ctx.C,N),adim('stMerecS',['',t('colSi')],ctx.A.map((a,i)=>[a,Si[i]])),matrisAdim('stMerecSp',ctx.A,ctx.C,Sp),adim('stMerecE',['',t('colEj'),t('colWeight')],ctx.C.map((c,j)=>[c,E[j],w[j]]))]}},
  ahp(X,yon,ctx){return ahpHesap(ctx)},
  bwm(X,yon,ctx){return bwmHesap(ctx)}};
const OBJEKTIF=new Set(['entropi','critic','sd','merec']);

/* ====================== AHP ====================== */
const RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
const SAATY=[1/9,1/8,1/7,1/6,1/5,1/4,1/3,1/2,1,2,3,4,5,6,7,8,9];
function ahpDeger(m,a,b){if(a===b)return 1;const v=m[a+'|'+b];if(typeof v==='number'&&v>0)return v;const r=m[b+'|'+a];if(typeof r==='number'&&r>0)return 1/r;return null}
function ahpMatris(m,ids){return ids.map(a=>ids.map(b=>ahpDeger(m,a,b)))}
function ozvektor(A){const n=A.length;let w=Array(n).fill(1/n);for(let it=0;it<5000;it++){const y=A.map(r=>topla(r.map((x,j)=>x*w[j])));const s=topla(y);const v=y.map(x=>x/s);
    const fark=Math.max(...v.map((x,i)=>Math.abs(x-w[i])));w=v;if(fark<1e-14)break}
  const Aw=A.map(r=>topla(r.map((x,j)=>x*w[j])));const lmax=ort(Aw.map((x,i)=>x/w[i]));return {w,lmax}}
function tutarlilik(A){const n=A.length;const {w,lmax}=ozvektor(A);const ci=n>2?(lmax-n)/(n-1):0;const ri=RI[Math.min(n,15)]||1.59;const cr=n>2?ci/ri:0;return {w,lmax,ci,ri,cr}}
/* En tutarsız yargı: a_ij ile w_i/w_j oranı arasındaki en büyük sapma; önerilen değer en yakın Saaty değeri. */
function enTutarsiz(A,w){let en=null;for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){const e=Math.abs(Math.log(A[i][j]*w[j]/w[i]));if(!en||e>en.e)en={i,j,e,oneri:SAATY.reduce((b,s)=>Math.abs(Math.log(s/(w[i]/w[j])))<Math.abs(Math.log(b/(w[i]/w[j])))?s:b,1)}}return en}
function ahpUzmanlar(ctx){return ctx.ahp.uzmanlar.map(u=>{const A=ahpMatris(u.m,ctx.Cid);const eksik=A.flat().filter(x=>x==null).length/2;return {u,A,eksik}})}
function ahpHesap(ctx){const n=ctx.Cid.length;if(n<2)return {hata:'needCriteria'};const U=ahpUzmanlar(ctx);if(!U.length)return {hata:'ahpNoExpert'};
  const eksik=U.filter(x=>x.eksik>0);if(eksik.length)return {hata:'ahpIncomplete',hataArg:[eksik.map(x=>x.u.ad||t('expertN',U.indexOf(x)+1)).join(', ')]};
  const bir=U.map(x=>({...x,...tutarlilik(x.A)}));const adimlar=[];const C=ctx.C;
  bir.forEach((x,k)=>{if(U.length>1)adimlar.push(matrisAdim('stAhpExpert',C,C,x.A,t('ahpCrLine',x.u.ad||t('expertN',k+1),sayi(x.cr,4))))});
  let G,w,ozet;
  if(ctx.ahp.birlestir==='aip'&&U.length>1){const gw=C.map((_,j)=>Math.exp(ort(bir.map(x=>Math.log(x.w[j])))));const s=topla(gw);w=gw.map(x=>x/s);G=null;
    adimlar.push(adim('stAhpAip',['',...bir.map((x,k)=>x.u.ad||t('expertN',k+1)),t('colGeoMean'),t('colWeight')],C.map((c,j)=>[c,...bir.map(x=>x.w[j]),gw[j],w[j]])));ozet={cr:Math.max(...bir.map(x=>x.cr)),lmax:null,ci:null,ri:RI[Math.min(n,15)]}}
  else{G=C.map((_,i)=>C.map((_,j)=>Math.exp(ort(U.map(x=>Math.log(x.A[i][j]))))));const tt=tutarlilik(G);w=tt.w;ozet=tt;
    adimlar.push(matrisAdim(U.length>1?'stAhpGroup':'stAhpMatrix',C,C,G,U.length>1?t('noteAij'):''));
    const cs=C.map((_,j)=>topla(G.map(r=>r[j])));adimlar.push(matrisAdim('stAhpNorm',C,C,G.map(r=>r.map((x,j)=>x/cs[j])),t('noteAhpNorm')));
    adimlar.push(adim('stAhpWeights',['',t('colAw'),t('colAwW'),t('colWeight')],C.map((c,j)=>{const aw=topla(G[j].map((x,k)=>x*w[k]));return [c,aw,aw/w[j],w[j]]})));
    adimlar.push(adim('stAhpCons',[t('colMeasure'),t('colValue')],[['λmax',tt.lmax],['n',n],['CI',tt.ci],['RI',tt.ri],['CR',tt.cr]],t('noteCr')))}
  const uyari=[];bir.forEach((x,k)=>{if(n>2&&x.cr>0.1){const et=enTutarsiz(x.A,x.w);uyari.push(t('ahpCrHigh',x.u.ad||t('expertN',k+1),sayi(x.cr,3),C[et.i],C[et.j],saatyYaz(x.A[et.i][et.j]),saatyYaz(et.oneri)))}});
  if(n>15)uyari.push(t('ahpTooMany'));
  return {w,adimlar,uyari,ahp:{uzman:bir.map(x=>({ad:x.u.ad,cr:x.cr,lmax:x.lmax,ci:x.ci})),G,...ozet,birlestir:U.length>1?ctx.ahp.birlestir:null}}}
function saatyYaz(v){if(v>=1)return sayi(Math.round(v*1000)/1000,v%1?2:0);const r=1/v;return Math.abs(r-Math.round(r))<1e-6?'1/'+Math.round(r):sayi(v,3)}

/* ====================== BWM (doğrusal model, Rezaei 2016) ======================
   min ξ, |w_B - a_Bj w_j| <= ξ, |w_j - a_jW w_W| <= ξ, Σw = 1, w >= 0. Küçük bir simpleks çözücüyle (Büyük M, Bland kuralı). */
function lpEnKucuk(c,Aub,bub,Aeq,beq){const nv=c.length,mu=Aub.length,me=Aeq.length,M=1e7,nc=nv+mu+me;const T=[],bas=[];
  for(let i=0;i<mu;i++){const r=new Array(nc+1).fill(0);for(let j=0;j<nv;j++)r[j]=Aub[i][j];r[nv+i]=1;r[nc]=bub[i];T.push(r);bas.push(nv+i)}
  for(let i=0;i<me;i++){const r=new Array(nc+1).fill(0);for(let j=0;j<nv;j++)r[j]=Aeq[i][j];r[nv+mu+i]=1;r[nc]=beq[i];T.push(r);bas.push(nv+mu+i)}
  const cost=new Array(nc).fill(0);for(let j=0;j<nv;j++)cost[j]=c[j];for(let i=0;i<me;i++)cost[nv+mu+i]=M;
  for(let it=0;it<5000;it++){let gir=-1;for(let j=0;j<nc;j++){let d=cost[j];for(let i=0;i<T.length;i++)d-=cost[bas[i]]*T[i][j];if(d<-1e-9){gir=j;break}}
    if(gir<0)break;let cik=-1,en=Infinity;for(let i=0;i<T.length;i++){if(T[i][gir]>1e-12){const o=T[i][nc]/T[i][gir];if(o<en-1e-12||(Math.abs(o-en)<=1e-12&&bas[i]<bas[cik])){en=o;cik=i}}}
    if(cik<0)return null;const pv=T[cik][gir];for(let j=0;j<=nc;j++)T[cik][j]/=pv;for(let i=0;i<T.length;i++)if(i!==cik&&Math.abs(T[i][gir])>0){const f=T[i][gir];for(let j=0;j<=nc;j++)T[i][j]-=f*T[cik][j]}bas[cik]=gir}
  const x=new Array(nv).fill(0);bas.forEach((b,i)=>{if(b<nv)x[b]=T[i][nc]});for(let i=0;i<me;i++){const k=bas.indexOf(nv+mu+i);if(k>=0&&T[k][nc]>1e-7)return null}return x}
const BWM_ESIK=[[0.1667,0.1667,0.1667,0.1667,0.1667,0.1667,0.1667],[0.1121,0.1529,0.1898,0.2206,0.2527,0.2577,0.2683],[0.1354,0.1994,0.2306,0.2546,0.2716,0.2844,0.2960],
  [0.1330,0.1990,0.2643,0.3044,0.3144,0.3221,0.3262],[0.1294,0.2457,0.2819,0.3029,0.3144,0.3251,0.3403],[0.1309,0.2521,0.2958,0.3154,0.3408,0.3620,0.3657],[0.1359,0.2681,0.3062,0.3337,0.3517,0.3620,0.3662]];
function bwmEsik(aBW,n){if(aBW<3||aBW>9||n<3||n>9)return null;return BWM_ESIK[Math.round(aBW)-3][n-3]}
function bwmTek(u,ids){const n=ids.length;const B=ids.indexOf(u.en),W=ids.indexOf(u.kotu);if(B<0||W<0)return {hata:'bwmChoose'};
  const aB=ids.map(id=>+u.bo[id]),aW=ids.map(id=>+u.ow[id]);aB[B]=1;aW[W]=1;if(aB.some(x=>!(x>=1&&x<=9))||aW.some(x=>!(x>=1&&x<=9)))return {hata:'bwmIncomplete'};
  if(B===W&&n>1)return {hata:'bwmSame'};
  const nv=n+1,c=Array(nv).fill(0);c[n]=1;const Aub=[],bub=[];const satir=()=>Array(nv).fill(0);
  for(let j=0;j<n;j++){let r=satir();r[B]+=1;r[j]-=aB[j];r[n]=-1;Aub.push(r);bub.push(0);r=satir();r[B]-=1;r[j]+=aB[j];r[n]=-1;Aub.push(r);bub.push(0);
    r=satir();r[j]+=1;r[W]-=aW[j];r[n]=-1;Aub.push(r);bub.push(0);r=satir();r[j]-=1;r[W]+=aW[j];r[n]=-1;Aub.push(r);bub.push(0)}
  const eq=satir();for(let j=0;j<n;j++)eq[j]=1;const x=lpEnKucuk(c,Aub,bub,[eq],[1]);if(!x)return {hata:'bwmSolve'};
  const w=x.slice(0,n),xi=x[n];const aBW=aB[W];const crI=aBW>1?Math.max(...ids.map((_,j)=>Math.abs(aB[j]*aW[j]-aBW)/(aBW*(aBW-1)))):0;
  return {w,xi,crI,aBW,aB,aW,B,W,esik:bwmEsik(aBW,n)}}
function bwmHesap(ctx){const ids=ctx.Cid,C=ctx.C;if(ids.length<2)return {hata:'needCriteria'};const U=ctx.bwm.uzmanlar;if(!U.length)return {hata:'bwmNoExpert'};
  const R=U.map(u=>({u,...bwmTek(u,ids)}));const hata=R.find(r=>r.hata);if(hata)return {hata:hata.hata,hataArg:[hata.u.ad||t('expertN',U.indexOf(hata.u)+1)]};
  const adimlar=[],uyari=[];R.forEach((r,k)=>{const ad=r.u.ad||t('expertN',k+1);
    adimlar.push(adim('stBwmVec',['',t('colBO',C[r.B]),t('colOW',C[r.W]),t('colWeight')],C.map((c,j)=>[c,r.aB[j],r.aW[j],r.w[j]]),t('bwmLine',ad,sayi(r.xi,4),sayi(r.crI,4),r.esik==null?'-':sayi(r.esik,4))));
    if(r.esik!=null&&r.crI>r.esik)uyari.push(t('bwmCrHigh',ad,sayi(r.crI,3),sayi(r.esik,3)))});
  let w=R[0].w;if(R.length>1){w=C.map((_,j)=>ort(R.map(r=>r.w[j])));const s=topla(w);w=w.map(x=>x/s);adimlar.push(adim('stBwmGroup',['',...R.map((r,k)=>r.u.ad||t('expertN',k+1)),t('colWeight')],C.map((c,j)=>[c,...R.map(r=>r.w[j]),w[j]]),t('noteBwmGroup')))}

/* ====================== SIRALAMA YÖNTEMLERİ ====================== */
const SIRALA={
  saw(X,yon,w,ctx){const N=normDogrusal(X,yon),V=agirliklandir(N,w);const s=V.map(topla);
    return sonuc(s,true,[matrisAdim('stLinNorm',ctx.A,ctx.C,N,t('noteLinNorm')),matrisAdim('stWeighted',ctx.A,ctx.C,V),adim('stScore',['',t('colScore'),t('colRank')],ctx.A.map((a,i)=>[a,s[i],siraBul(s)[i]]))])},
  topsis(X,yon,w,ctx){const N=normVektor(X),V=agirliklandir(N,w);const n=w.length;const ip=[],in_=[];
    for(let j=0;j<n;j++){const c=sut(V,j);ip[j]=yon[j]==='max'?enb(c):enk(c);in_[j]=yon[j]==='max'?enk(c):enb(c)}
    const dp=V.map(r=>Math.sqrt(topla(r.map((x,j)=>(x-ip[j])**2)))),dn=V.map(r=>Math.sqrt(topla(r.map((x,j)=>(x-in_[j])**2))));
    const Cc=dp.map((d,i)=>d+dn[i]>EPS?dn[i]/(d+dn[i]):0);const sr=siraBul(Cc);
    return sonuc(Cc,true,[matrisAdim('stVecNorm',ctx.A,ctx.C,N,t('noteVecNorm')),matrisAdim('stWeighted',ctx.A,ctx.C,V),adim('stIdeal',['',...ctx.C],[[t('rowPIS'),...ip],[t('rowNIS'),...in_]]),
      adim('stTopsis',['','S⁺','S⁻','C*',t('colRank')],ctx.A.map((a,i)=>[a,dp[i],dn[i],Cc[i],sr[i]]))])},
  vikor(X,yon,w,ctx){const v=ctx.param.v,n=w.length,m=X.length;const fs=[],fe=[];for(let j=0;j<n;j++){const c=sut(X,j);fs[j]=yon[j]==='max'?enb(c):enk(c);fe[j]=yon[j]==='max'?enk(c):enb(c)}
    const T=X.map(r=>r.map((x,j)=>Math.abs(fs[j]-fe[j])<EPS?0:w[j]*(fs[j]-x)/(fs[j]-fe[j])));const Sv=T.map(topla),Rv=T.map(r=>Math.max(...r));
    const Ss=enk(Sv),Se=enb(Sv),Rs=enk(Rv),Re=enb(Rv);const Q=Sv.map((s,i)=>v*(Se-Ss>EPS?(s-Ss)/(Se-Ss):0)+(1-v)*(Re-Rs>EPS?(Rv[i]-Rs)/(Re-Rs):0));
    const srQ=siraBul(Q,false),srS=siraBul(Sv,false),srR=siraBul(Rv,false);const sirali=Q.map((q,i)=>i).sort((a,b)=>Q[a]-Q[b]);
    const DQ=m>1?1/(m-1):0;const a1=sirali[0],a2=sirali[1];const c1=m<2||Q[a2]-Q[a1]>=DQ-1e-12;const c2=srS[a1]===1||srR[a1]===1;
    let uzlasi=[a1];if(!c1){uzlasi=sirali.filter(i=>Q[i]-Q[a1]<DQ-1e-12)}else if(!c2)uzlasi=[a1,a2];
    const kosul=t('vikorCond',sayi(DQ,4),sayi(Q[a2]-Q[a1],4),c1?t('yes'):t('no'),c2?t('yes'):t('no'),uzlasi.map(i=>ctx.A[i]).join(', '));
    return sonuc(Q,false,[{...adim('stVikorF',['',...ctx.C],[['f*',...fs],['f⁻',...fe]]),ham:true},matrisAdim('stVikorT',ctx.A,ctx.C,T,t('noteVikorT')),
      adim('stVikor',['','S','R','Q',t('colRankS'),t('colRankR'),t('colRankQ')],ctx.A.map((a,i)=>[a,Sv[i],Rv[i],Q[i],srS[i],srR[i],srQ[i]]),kosul)],{vikor:{S:Sv,R:Rv,c1,c2,uzlasi,DQ}})},
  moora(X,yon,w,ctx){const N=normVektor(X),V=agirliklandir(N,w);const ar=V.map(r=>topla(r.filter((_,j)=>yon[j]==='max'))),ek=V.map(r=>topla(r.filter((_,j)=>yon[j]==='min')));const y=ar.map((a,i)=>a-ek[i]);
    return sonuc(y,true,[matrisAdim('stVecNorm',ctx.A,ctx.C,N,t('noteVecNorm')),matrisAdim('stWeighted',ctx.A,ctx.C,V),adim('stMoora',['',t('colSumMax'),t('colSumMin'),'y*',t('colRank')],ctx.A.map((a,i)=>[a,ar[i],ek[i],y[i],siraBul(y)[i]]))])},
  waspas(X,yon,w,ctx){const L=ctx.param.lambda;const N=normDogrusal(X,yon);const q1=N.map(r=>topla(r.map((x,j)=>x*w[j]))),q2=N.map(r=>r.reduce((p,x,j)=>p*Math.pow(x,w[j]),1));const Q=q1.map((a,i)=>L*a+(1-L)*q2[i]);
    return sonuc(Q,true,[matrisAdim('stLinNorm',ctx.A,ctx.C,N,t('noteLinNorm')),adim('stWaspas',['','Q⁽¹⁾ (WSM)','Q⁽²⁾ (WPM)','Q',t('colRank')],ctx.A.map((a,i)=>[a,q1[i],q2[i],Q[i],siraBul(Q)[i]]),t('noteWaspas',sayi(L,2)))])},
  edas(X,yon,w,ctx){const n=w.length;const AV=[];for(let j=0;j<n;j++)AV[j]=ort(sut(X,j));if(AV.some(a=>Math.abs(a)<EPS))return {hata:'edasZeroAvg'};
    const PDA=X.map(r=>r.map((x,j)=>Math.max(0,yon[j]==='max'?(x-AV[j]):(AV[j]-x))/AV[j])),NDA=X.map(r=>r.map((x,j)=>Math.max(0,yon[j]==='max'?(AV[j]-x):(x-AV[j]))/AV[j]));
    const SP=PDA.map(r=>topla(r.map((x,j)=>x*w[j]))),SN=NDA.map(r=>topla(r.map((x,j)=>x*w[j])));const mp=enb(SP),mn=enb(SN);
    const NSP=SP.map(x=>mp>EPS?x/mp:0),NSN=SN.map(x=>mn>EPS?1-x/mn:1);const AS=NSP.map((x,i)=>(x+NSN[i])/2);
    return sonuc(AS,true,[adim('stEdasAv',['',...ctx.C],[['AV',...AV]]),matrisAdim('stEdasPda',ctx.A,ctx.C,PDA),matrisAdim('stEdasNda',ctx.A,ctx.C,NDA),
      adim('stEdas',['','SP','SN','NSP','NSN','AS',t('colRank')],ctx.A.map((a,i)=>[a,SP[i],SN[i],NSP[i],NSN[i],AS[i],siraBul(AS)[i]]))])},
  copras(X,yon,w,ctx){const n=w.length;const cs=[];for(let j=0;j<n;j++)cs[j]=topla(sut(X,j));const D=X.map(r=>r.map((x,j)=>w[j]*x/cs[j]));
    const Sp=D.map(r=>topla(r.filter((_,j)=>yon[j]==='max'))),Sm=D.map(r=>topla(r.filter((_,j)=>yon[j]==='min')));const maliyetVar=yon.includes('min');
    const Q=maliyetVar?Sp.map((s,i)=>s+topla(Sm)/(Sm[i]*topla(Sm.map(x=>1/x)))):Sp.slice();const U=Q.map(q=>q/enb(Q)*100);
    return sonuc(Q,true,[matrisAdim('stCoprasD',ctx.A,ctx.C,D,t('noteCopras')),adim('stCopras',['','S⁺','S⁻','Q',t('colUtility'),t('colRank')],ctx.A.map((a,i)=>[a,Sp[i],Sm[i],Q[i],U[i],siraBul(Q)[i]]))],{copras:{U}})},
  aras(X,yon,w,ctx){const n=w.length;const x0=[];for(let j=0;j<n;j++){const c=sut(X,j);x0[j]=yon[j]==='max'?enb(c):enk(c)}const T=[x0,...X].map(r=>r.map((x,j)=>yon[j]==='max'?x:1/x));
    const cs=[];for(let j=0;j<n;j++)cs[j]=topla(sut(T,j));const N=T.map(r=>r.map((x,j)=>x/cs[j])),V=agirliklandir(N,w);const Sv=V.map(topla);const K=Sv.slice(1).map(s=>s/Sv[0]);
    const A0=[t('rowOptimal'),...ctx.A];return sonuc(K,true,[{...adim('stArasX0',['',...ctx.C],[[t('rowOptimal'),...x0]]),ham:true},matrisAdim('stArasN',A0,ctx.C,N,t('noteAras')),matrisAdim('stWeighted',A0,ctx.C,V),
      adim('stAras',['','S','K',t('colRank')],[[t('rowOptimal'),Sv[0],1,'-'],...ctx.A.map((a,i)=>[a,Sv[i+1],K[i],siraBul(K)[i]])])])},
  mabac(X,yon,w,ctx){const m=X.length,n=w.length;const N=X.map(r=>r.slice());const mx=[],mn=[];for(let j=0;j<n;j++){mx[j]=enb(sut(X,j));mn[j]=enk(sut(X,j))}
    for(const r of N)for(let j=0;j<n;j++){const a=mx[j]-mn[j];r[j]=a<EPS?1:(yon[j]==='max'?(r[j]-mn[j])/a:(r[j]-mx[j])/(mn[j]-mx[j]))}
    const V=N.map(r=>r.map((x,j)=>w[j]*(x+1)));const G=[];for(let j=0;j<n;j++)G[j]=Math.pow(sut(V,j).reduce((p,x)=>p*x,1),1/m);
    const Q=V.map(r=>r.map((x,j)=>x-G[j]));const Sv=Q.map(topla);
    return sonuc(Sv,true,[matrisAdim('stMinMax',ctx.A,ctx.C,N),matrisAdim('stMabacV',ctx.A,ctx.C,V,t('noteMabacV')),adim('stMabacG',['',...ctx.C],[['G',...G]]),matrisAdim('stMabacQ',ctx.A,ctx.C,Q),
      adim('stScore',['','S',t('colRank')],ctx.A.map((a,i)=>[a,Sv[i],siraBul(Sv)[i]]))])},
  marcos(X,yon,w,ctx){const n=w.length;const aai=[],ai=[];for(let j=0;j<n;j++){const c=sut(X,j);aai[j]=yon[j]==='max'?enk(c):enb(c);ai[j]=yon[j]==='max'?enb(c):enk(c)}
    const E=[aai,...X,ai];const N=E.map(r=>r.map((x,j)=>yon[j]==='max'?x/ai[j]:ai[j]/x)),V=agirliklandir(N,w);const Sv=V.map(topla);const Saai=Sv[0],Sai=Sv[Sv.length-1];
    const Km=[],Kp=[],F=[];for(let i=1;i<Sv.length-1;i++){const km=Sv[i]/Saai,kp=Sv[i]/Sai;const fkp=km/(kp+km),fkm=kp/(kp+km);Km.push(km);Kp.push(kp);F.push((kp+km)/(1+(1-fkp)/fkp+(1-fkm)/fkm))}

    return sonuc(F,true,[matrisAdim('stMarcosN',AE,ctx.C,N,t('noteMarcos')),matrisAdim('stWeighted',AE,ctx.C,V),
      adim('stMarcos',['','S','K⁻','K⁺','f(K)',t('colRank')],ctx.A.map((a,i)=>[a,Sv[i+1],Km[i],Kp[i],F[i],siraBul(F)[i]]),t('noteMarcosS',sayi(Saai,4),sayi(Sai,4)))])}};

/* ====================== HAZIRLIK VE BÜTÜN HESAP ====================== */
function matrisDurum(p=P()){const C=p.kriterler,A=p.alternatifler;const o={tamam:false,A:A.map((a,i)=>a.ad||t('altN',i+1)),C:C.map((k,j)=>k.ad||t('critN',j+1)),Cid:C.map(k=>k.id),yon:C.map(k=>k.yon),eksik:0,X:null,sorun:null};
  if(A.length<2||C.length<2){o.sorun=A.length<2?'needAlternatives':'needCriteria';return o}
  const X=A.map(a=>C.map(k=>p.X[a.id]?.[k.id]??null));o.eksik=X.flat().filter(x=>x==null).length;if(o.eksik){o.sorun='matrixIncomplete';return o}
  o.X=X;o.tamam=true;return o}
function baglam(p,md){return {A:md.A,C:md.C,Cid:md.Cid,param:p.param,dogrudan:p.agirlik.dogrudan,ahp:p.agirlik.ahp,bwm:p.agirlik.bwm}}
function agirlikHesap(p=P(),md=matrisDurum(p)){const y=p.agirlik.yontem,ctx=baglam(p,md);
  if(md.Cid.length<2)return {hata:'needCriteria'};
  if(OBJEKTIF.has(y)&&!md.tamam)return {hata:md.sorun,hataArg:[sayi(md.eksik)]};
  try{const r=AGIRLIK[y](md.X,md.yon,ctx);if(r.hata)return r;if(r.w.some(x=>!isFinite(x)))return {hata:'calcError'};return {uyari:[],...r}}catch(e){console.error(e);return {hata:'calcError'}}}
function siralamaHesap(y,X,yon,w,ctx){const g=GEREK[y];const h=g?gerekKontrol(X,g):null;if(h)return {hata:h};try{const r=SIRALA[y](X,yon,w,ctx);if(r.hata)return r;if(r.skor.some(x=>!isFinite(x)))return {hata:'calcError'};return r}catch(e){console.error(e);return {hata:'calcError'}}}
/* Bütün sonuçlar tek yerde hesaplanır ve S.sonuc'ta saklanır; proje değişince sıfırlanır. */
function hesapla(){if(S.sonuc&&S.sonuc.dil===S.dil)return S.sonuc;const p=P(),md=matrisDurum(p),ag=agirlikHesap(p,md),ctx=baglam(p,md);const R={dil:S.dil,md,ag,yon:{},hazir:false};
  if(md.tamam&&!ag.hata){R.hazir=true;for(const y of p.yontemler)R.yon[y]=siralamaHesap(y,md.X,md.yon,ag.w,ctx)}
  S.sonuc=R;return R}
function gecerliYontemler(R=hesapla()){return P().yontemler.filter(y=>R.yon[y]&&!R.yon[y].hata)}
function karsilastirma(R=hesapla()){const L=gecerliYontemler(R);if(L.length<1)return null;const m=R.md.A.length;
  const ortalama=R.md.A.map((_,i)=>ort(L.map(y=>R.yon[y].sira[i])));const genel=siraBul(ortalama,false);
  const rho=L.map(a=>L.map(b=>spearman(R.yon[a].ort,R.yon[b].ort)));const diz=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)diz.push(rho[i][j]);
  return {L,ortalama,genel,rho,min:diz.length?enk(diz):null,max:diz.length?enb(diz):null,ilk:L.map(y=>R.yon[y].sira.indexOf(1)),m}}
function oranlarOku(s){const L=[];for(const p of String(s||'').replace(/,\s+/g,' ').split(/[;\s]+/).filter(Boolean)){const v=sayiOku(p);if(v!=null)L.push(v);else p.split(',').forEach(q=>{const x=sayiOku(q);if(x!=null)L.push(x)})}
  return [...new Set(L.filter(x=>x>-100&&x!==0&&x<=1000))].sort((a,b)=>a-b)}
/* Duyarlılık: bir kriterin ağırlığı oranla değiştirilir, diğerleri toplam 1 kalacak biçimde orantılı ayarlanır. */
function duyarlilik(R=hesapla(),y,oranlar){if(!R.hazir||!R.yon[y]||R.yon[y].hata)return null;const p=P(),w0=R.ag.w,n=w0.length,ctx=baglam(p,R.md);const temel=R.yon[y];const S0=[];
  for(let j=0;j<n;j++)for(const o of oranlar){const yeni=Math.min(1,Math.max(0,w0[j]*(1+o/100)));if(w0[j]>=1-EPS)continue;const k=(1-yeni)/(1-w0[j]);const w=w0.map((x,i)=>i===j?yeni:x*k);
    const r=siralamaHesap(y,R.md.X,R.md.yon,w,ctx);if(r.hata)continue;S0.push({j,o,w,sira:r.sira,rho:spearman(temel.ort,r.ort),ilkAyni:r.sira.indexOf(1)===temel.sira.indexOf(1),ayni:r.sira.every((s,i)=>s===temel.sira[i])})}
  return {temel,senaryo:S0,ilkAyni:S0.filter(s=>s.ilkAyni).length,ayni:S0.filter(s=>s.ayni).length,rhoMin:S0.length?enk(S0.map(s=>s.rho)):null}}

/* ====================== ORTAK GÖSTERİM ====================== */
const SIRA_BASLIK=()=>new Set([t('colRank'),t('colRankS'),t('colRankR'),t('colRankQ')]);
function fmt(v,tamsayi){if(v==null||v==='')return '-';if(typeof v!=='number')return String(v);if(!isFinite(v))return '-';if(Math.abs(v)<1e-12)v=0;if(tamsayi)return sayi(v,0);
  const o=P().ondalik;const a=Math.abs(v);if(a!==0&&a<Math.pow(10,-o))return v.toExponential(2).replace('.',S.dil==='tr'?',':'.');return sayi(v,o)}
const fmtHam=v=>v==null?'-':typeof v!=='number'?String(v):Number(Math.abs(v)<1e-12?0:v).toLocaleString(S.dil,{maximumFractionDigits:10});
/* Türkçede yüzde işareti sayıdan önce gelir: +%25; İngilizcede sonra: +25%. */
const yuzdeYaz=o=>{const i=o>0?'+':o<0?'-':'',n=sayi(Math.abs(o),o%1?1:0);return S.dil==='tr'?i+'%'+n:i+n+'%'};
const yontemAd=y=>tAlt('yontemAd',y)||y.toUpperCase();
/* Bir adım tablosunu HTML'e çevirir. Sıra sütunları ve "n" satırı tamsayı gösterilir. */
function adimTablo(a,o={}){const sb=SIRA_BASLIK();const tam=a.sutun.map((s,j)=>sb.has(s)||!!(a.tam&&a.tam[j]));
  const bas=`<thead><tr>${a.sutun.map((s,j)=>`<th class="${j?'n':''}">${esc(s)}</th>`).join('')}</tr></thead>`;
  const gov=a.satirlar.map(r=>`<tr class="${o.ilk&&o.ilk(r)?'ilk':''}">${r.map((v,j)=>j===0?`<th class="font-medium text-left">${esc(v)}</th>`:`<td class="n">${esc(a.ham?fmtHam(v):fmt(v,tam[j]||r[0]==='n'))}</td>`).join('')}</tr>`).join('');
  return `<div class="overflow-x-auto"><table class="stablo">${bas}<tbody>${gov}</tbody></table></div>${a.not?`<p class="text-xs text-base-content/65 mt-2 leading-relaxed">${esc(a.not)}</p>`:''}`}
function adimlarHtml(L,baslik){if(!L||!L.length)return '';return `<details class="collapse collapse-arrow bg-base-100 border border-base-300 rounded-box"><summary class="collapse-title font-semibold text-sm">${esc(baslik||t('showSteps'))} <span class="badge badge-sm ml-1">${L.length}</span></summary>
  <div class="collapse-content space-y-5">${L.map((a,i)=>`<div><h4 class="text-sm font-semibold mb-2">${i+1}. ${esc(t(a.k))}</h4>${adimTablo(a)}</div>`).join('')}</div></details>`}
const uyariHtml=(m,tur='warning')=>m?`<div role="alert" class="alert alert-${tur} alert-soft text-sm"><span>${esc(m)}</span></div>`:'';
const hataMetni=r=>r&&r.hata?t('err_'+r.hata,...(r.hataArg||[])):'';
/* Yatay çubuk grafik (raporda da kullanılır; renkler sabit, arka plan beyaz). */
function cubukSvg(etiket,deger,o={}){const n=etiket.length,W=680,sol=Math.min(230,16+Math.max(...etiket.map(e=>String(e).length))*7.2),sag=86,ust=o.baslik?40:14,sat=26,H=ust+n*sat+14;
  const mx=Math.max(...deger.map(Math.abs),1e-12);const g=W-sol-sag;const ri=o.renk||'#8c2a3c';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Calibri, Segoe UI, Arial, sans-serif" font-size="13"><rect width="${W}" height="${H}" fill="#fff"/>`;
  if(o.baslik)s+=`<text x="16" y="24" font-size="15" font-weight="700" fill="#1c2230">${esc(o.baslik)}</text>`;
  etiket.forEach((e,i)=>{const y=ust+i*sat,v=deger[i],bw=Math.max(1,Math.abs(v)/mx*g);const ad=String(e).length>30?String(e).slice(0,29)+'…':String(e);
    s+=`<text x="${sol-10}" y="${y+17}" text-anchor="end" fill="#1c2230">${esc(ad)}</text><rect x="${sol}" y="${y+5}" width="${bw.toFixed(1)}" height="16" rx="3" fill="${o.vurgu===i?ri:ri}" fill-opacity="${o.vurgu==null||o.vurgu===i?1:.55}"/><text x="${(sol+bw+8).toFixed(1)}" y="${y+17}" fill="#3a4152">${esc(o.fmt?o.fmt(v):fmt(v))}</text>`});
  return s+'</svg>'}

/* ====================== KARAR MATRİSİ SEKMESİ ====================== */
const yonEtiket=y=>t(y==='min'?'dirMin':'dirMax');
function cizMatris(){const p=P(),C=p.kriterler,A=p.alternatifler,md=matrisDurum();
  $('#matrisOzet').textContent=t('matrixSummary',sayi(A.length),sayi(C.length),sayi(C.filter(k=>k.yon==='max').length),sayi(C.filter(k=>k.yon==='min').length));
  $('#mUyari').innerHTML=!C.length&&!A.length?uyariHtml(t('matrixEmpty'),'info'):md.sorun==='matrixIncomplete'?uyariHtml(t('err_matrixIncomplete',sayi(md.eksik))):md.sorun?uyariHtml(t('err_'+md.sorun)):'';

/* Sayıyı düzenleme kutusuna yazarken binlik ayıracı kullanılmaz. */
const sayiYaz=v=>{const s=String(+v.toPrecision(12));return S.dil==='tr'?s.replace('.',','):s};
function cizIstat(){const md=matrisDurum();if(!P().kriterler.length){$('#matrisIstat').innerHTML=`<p class="text-sm text-base-content/60">${esc(t('noData'))}</p>`;return}
  const p=P();const sat=p.kriterler.map((k,j)=>{const v=p.alternatifler.map(a=>p.X[a.id]?.[k.id]).filter(x=>x!=null);if(!v.length)return [md.C[j],yonEtiket(k.yon),'-','-','-','-','-'];const o=ort(v),s=ss(v);return [md.C[j],yonEtiket(k.yon),fmtHam(enk(v)),fmtHam(enb(v)),o,s,Math.abs(o)>EPS?s/Math.abs(o):null]});
  $('#matrisIstat').innerHTML=adimTablo(adim('',['',t('colDirection'),'Min','Maks',t('colMean'),t('colSd'),t('colCv')],sat))}
function hucreYaz(i,j,deger){const p=P(),a=p.alternatifler[i],k=p.kriterler[j];if(!a||!k)return;const v=deger===''?null:sayiOku(deger);
  const el=$(`#matrisTablo input.hucre[data-i="${i}"][data-j="${j}"]`);if(deger!==''&&v==null){el&&el.classList.add('hatali');tost(t('notNumber'),'warning');return}
  if((p.X[a.id][k.id]??null)===v){el&&el.classList.remove('hatali');return}
  islem(()=>{p.X[a.id][k.id]=v},{cizme:true});if(el){el.classList.remove('hatali');el.classList.toggle('bos',v==null)}matrisSonrasi()}
function matrisSonrasi(){const md=matrisDurum();$('#mUyari').innerHTML=md.sorun==='matrixIncomplete'?uyariHtml(t('err_matrixIncomplete',sayi(md.eksik))):md.sorun?uyariHtml(t('err_'+md.sorun)):'';cizIstat();rozetler()}
function altEkle(ad){const id=uid();P().alternatifler.push({id,ad:ad||''});P().X[id]={};P().kriterler.forEach(k=>P().X[id][k.id]=null);return id}
function kritEkle(ad,yon){const id=uid();P().kriterler.push({id,ad:ad||'',yon:yon||'max',birim:''});P().alternatifler.forEach(a=>P().X[a.id][id]=null);return id}
function kritSil(id){const p=P();p.kriterler=p.kriterler.filter(k=>k.id!==id);p.alternatifler.forEach(a=>delete p.X[a.id][id]);delete p.agirlik.dogrudan[id];
  p.agirlik.ahp.uzmanlar.forEach(u=>{for(const k of Object.keys(u.m))if(k.split('|').includes(id))delete u.m[k]});
  p.agirlik.bwm.uzmanlar.forEach(u=>{if(u.en===id)u.en=null;if(u.kotu===id)u.kotu=null;delete u.bo[id];delete u.ow[id]})}
function altSil(id){const p=P();p.alternatifler=p.alternatifler.filter(a=>a.id!==id);delete p.X[id]}
function odakla(i,j){const e=$(`#matrisTablo input.hucre[data-i="${i}"][data-j="${j}"]`);if(e){e.focus();e.select()}}
function matrisOlaylari(){const T=$('#matrisTablo');
  T.addEventListener('change',e=>{const x=e.target;if(x.classList.contains('hucre'))hucreYaz(+x.dataset.i,+x.dataset.j,x.value.trim());
    else if(x.dataset.kad){const k=P().kriterler.find(k=>k.id===x.dataset.kad);if(k&&k.ad!==x.value.trim())islem(()=>{k.ad=x.value.trim()},{cizme:true});cizIstat()}
    else if(x.dataset.aad){const a=P().alternatifler.find(a=>a.id===x.dataset.aad);if(a&&a.ad!==x.value.trim())islem(()=>{a.ad=x.value.trim()},{cizme:true})}});
  T.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.kyon){const k=P().kriterler.find(k=>k.id===b.dataset.kyon);if(k&&k.yon!==b.dataset.v)islem(()=>{k.yon=b.dataset.v})}
    else if(b.dataset.ksil){const k=P().kriterler.find(k=>k.id===b.dataset.ksil);const dolu=P().alternatifler.some(a=>P().X[a.id][k.id]!=null);
      const f=()=>islem(()=>{kritSil(k.id);gunlukEkle(t('logCritDel',k.ad))});if(dolu)sor(t('deleteCritQ',k.ad||'-'),t('delete'),1).then(r=>r&&f());else f()}
    else if(b.dataset.asil){const a=P().alternatifler.find(a=>a.id===b.dataset.asil);const dolu=P().kriterler.some(k=>P().X[a.id][k.id]!=null);
      const f=()=>islem(()=>{altSil(a.id);gunlukEkle(t('logAltDel',a.ad))});if(dolu)sor(t('deleteAltQ',a.ad||'-'),t('delete'),1).then(r=>r&&f());else f()}});
  T.addEventListener('keydown',e=>{const x=e.target;if(!x.classList.contains('hucre'))return;const i=+x.dataset.i,j=+x.dataset.j;
    if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();x.dispatchEvent(new Event('change',{bubbles:true}));if(i+1<P().alternatifler.length)odakla(i+1,j);else if(e.key==='Enter'){islem(()=>altEkle());setTimeout(()=>odakla(i+1,j),0)}}
    else if(e.key==='ArrowUp'){e.preventDefault();x.dispatchEvent(new Event('change',{bubbles:true}));if(i>0)odakla(i-1,j)}
    else if(e.key==='ArrowRight'&&x.selectionStart===x.value.length){x.dispatchEvent(new Event('change',{bubbles:true}));odakla(i,j+1)}
    else if(e.key==='ArrowLeft'&&x.selectionStart===0&&x.selectionEnd===0){x.dispatchEvent(new Event('change',{bubbles:true}));odakla(i,j-1)}});
  /* Excel'den bir hücre bloğu yapıştırılırsa, imlecin bulunduğu hücreden başlayarak doldurulur; gerekirse satır ve sütun eklenir. */
  T.addEventListener('paste',e=>{const x=e.target;if(!x.classList.contains('hucre'))return;const m=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(m.trim()))return;e.preventDefault();
    const sat=m.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(r=>r.split('\t'));const i0=+x.dataset.i,j0=+x.dataset.j;let hatali=0;
    islem(()=>{const p=P();while(p.alternatifler.length<i0+sat.length)altEkle();const gen=Math.max(...sat.map(r=>r.length));while(p.kriterler.length<j0+gen)kritEkle();
      sat.forEach((r,a)=>r.forEach((v,b)=>{const al=p.alternatifler[i0+a],k=p.kriterler[j0+b];const s=v.trim();if(s===''){p.X[al.id][k.id]=null;return}const n=sayiOku(s);if(n==null)hatali++;else p.X[al.id][k.id]=n}))});
    tost(hatali?t('pastedWithErrors',sayi(hatali)):t('pasted'),hatali?'warning':'success')});
  $('#mAltEkle').onclick=()=>{const i=P().alternatifler.length;islem(()=>altEkle());const e=$(`#matrisTablo [data-aad="${P().alternatifler[i].id}"]`);e&&e.focus()};
  $('#mKritEkle').onclick=()=>{const j=P().kriterler.length;islem(()=>kritEkle());const e=$(`#matrisTablo [data-kad="${P().kriterler[j].id}"]`);e&&e.focus()};
  $('#mYapistir').onclick=()=>tabloPencere(null)}

/* ====================== TABLO İÇE AKTARMA ======================
   Biçim: ilk satır kriter adları, ilk sütun alternatif adları. İsteğe bağlı ikinci satır kriter yönü (fayda/maliyet, max/min). */
const YON_MAX=new Set(['max','maks','maximum','fayda','benefit','b','+','yukarı','artan','yüksek','profit']),YON_MIN=new Set(['min','minimum','maliyet','cost','c','-','aşağı','azalan','düşük','kayıp']);
const yonOku=s=>{const k=katla(String(s??'').trim());return YON_MAX.has(k)?'max':YON_MIN.has(k)?'min':null};
function tabloCoz(sat,o){sat=sat.map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(x=>x));if(!sat.length)return null;const gen=Math.max(...sat.map(r=>r.length));sat=sat.map(r=>{while(r.length<gen)r.push('');return r});
  let i=0;const bs=o.baslik?sat[i++]:null;let yonS=null;if(sat[i]&&sat[i].slice(o.adlar?1:0).filter(x=>x).every(x=>yonOku(x))&&sat[i].slice(o.adlar?1:0).some(x=>x)){yonS=sat[i++]}
  const veri=sat.slice(i);const j0=o.adlar?1:0;const krit=[];for(let j=j0;j<gen;j++)krit.push({ad:bs?bs[j]:'',yon:yonS?(yonOku(yonS[j])||'max'):'max'});
  const alt=veri.map((r,k)=>({ad:o.adlar?r[0]:'',v:r.slice(j0).map(x=>x===''?null:sayiOku(x)),ham:r.slice(j0)}));
  const hatali=alt.reduce((s,a)=>s+a.v.filter((x,j)=>x==null&&a.ham[j]!=='').length,0);return {krit,alt,hatali,yonVar:!!yonS}}
function tabloUygula(c){const p=P();p.kriterler=[];p.alternatifler=[];p.X={};const kid=c.krit.map(k=>kritEkle(k.ad,k.yon));c.alt.forEach(a=>{const id=altEkle(a.ad);a.v.forEach((v,j)=>{if(kid[j])p.X[id][kid[j]]=v})});
  p.agirlik.dogrudan={};p.agirlik.ahp.uzmanlar.forEach(u=>u.m={});p.agirlik.bwm.uzmanlar.forEach(u=>{u.en=u.kotu=null;u.bo={};u.ow={}})}
async function tabloPencere(satirlar,dosyaAdi){let secim=null;
  const d=await pencere(t('pasteTitle'),`<div class="space-y-3">${satirlar?`<p class="text-sm">${esc(t('fileRead',dosyaAdi||'',sayi(satirlar.length)))}</p>`:`<p class="text-sm text-base-content/70">${esc(t('pasteLead'))}</p><textarea id="yMetin" class="textarea w-full font-mono text-xs" rows="8" placeholder="${esc(t('pastePh'))}"></textarea>`}
    <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm"><label class="flex items-center gap-2"><input type="checkbox" class="checkbox checkbox-sm" id="yBaslik" checked><span>${esc(t('firstRowNames'))}</span></label>
    <label class="flex items-center gap-2"><input type="checkbox" class="checkbox checkbox-sm" id="yAdlar" checked><span>${esc(t('firstColNames'))}</span></label></div>
    <p class="text-xs text-base-content/60">${esc(t('dirRowNote'))}</p><div id="yOnizleme"></div></div>`,
    [{ad:t('cancel'),d:null},{ad:t('importReplace'),c:'btn-primary',d:'uygula',f:()=>{const c=oniz();if(!c||!c.alt.length||!c.krit.length){tost(t('nothingToImport'),'warning');return false}secim=c}}],
    {genis:true,ip:'iceAktar',acilinca:()=>{['#yBaslik','#yAdlar'].forEach(s=>$(s).onchange=oniz);const m=$('#yMetin');if(m){m.oninput=oniz;m.focus()}oniz()}});
  if(d!=='uygula'||!secim)return;const c=secim;
  if((P().alternatifler.length||P().kriterler.length)&&!(await sor(t('replaceQ'),t('importReplace'),1)))return;
  islem(()=>{tabloUygula(c);gunlukEkle(t('logImported',c.alt.length,c.krit.length))});tost(t('imported',sayi(c.alt.length),sayi(c.krit.length))+(c.hatali?' '+t('pastedWithErrors',sayi(c.hatali)):''),c.hatali?'warning':'success');if(S.sekme!=='matris')sekmeAc('matris');
  function oniz(){const sat=satirlar||(($('#yMetin')?.value)||'').replace(/\r/g,'').split('\n').map(r=>r.includes('\t')?r.split('\t'):r.split(/;/));
    const c=tabloCoz(sat,{baslik:$('#yBaslik').checked,adlar:$('#yAdlar').checked});const k=$('#yOnizleme');if(!c){k.innerHTML='';return null}
    const C=c.krit.map((x,j)=>(x.ad||t('critN',j+1))+' ('+yonEtiket(x.yon)+')');const L=c.alt.slice(0,6).map((a,i)=>[a.ad||t('altN',i+1),...a.v.map(v=>v==null?'':v)]);
    k.innerHTML=`<p class="text-sm font-medium mb-1">${esc(t('previewN',sayi(c.alt.length),sayi(c.krit.length)))}${c.yonVar?' '+esc(t('dirRowFound')):''}</p>${adimTablo(adim('',['',...C],L))}${c.hatali?uyariHtml(t('pastedWithErrors',sayi(c.hatali))):''}`;return c}}
async function iceAktar(){const f=await dosyaOku('.xlsx,.csv,.tsv,.txt');if(!f)return;try{let sat;if(/\.xlsx$/i.test(f.name))sat=await xlsxSatirlar(await f.arrayBuffer());else{const b=new Uint8Array(await f.arrayBuffer());let m;try{m=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){m=new TextDecoder('windows-1254').decode(b)}sat=csvSatirlar(m)}
  if(!sat.length)throw new Error();tabloPencere(sat,f.name)}catch(e){tost(t('badFile'),'error')}}

/* ---------- AHP ---------- */
const pozDeger=p=>p<8?9-p:p>8?1/(p-7):1;
function degerPoz(v){if(v==null)return null;if(v>=1){const r=Math.round(v);return Math.max(0,8-(Math.min(9,r)-1))}const r=Math.round(1/v);return Math.min(16,8+(Math.min(9,r)-1))}
function ahpPanel(md){const p=P(),A=p.agirlik.ahp,sec=seciliUzman('ahp');const U=A.uzmanlar;
